name: Vérifier les PR 14 et 41 dans Chromium
on:
  push:
    branches: [codex/verification-pr-14-41]
permissions:
  contents: read
jobs:
  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer le navigateur de test
        run: |
          npm install --prefix /tmp/aldoria-tests playwright@1.55.0
          /tmp/aldoria-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Jouer les parcours
        env:
          NODE_PATH: /tmp/aldoria-tests/node_modules
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/aldoria-http.log 2>&1 &
          for test in verification/*.cjs; do node "$test"; done
