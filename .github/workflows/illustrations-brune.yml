name: Préparer les illustrations de Brune
on:
  push:
    branches-ignore: [main]
    paths: ['godot/illustrations/sources/**', 'godot/illustrations/preparer.py']
permissions:
  contents: write
jobs:
  atlas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet Pillow==11.3.0
          python godot/illustrations/preparer.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/aldoria/v1/planches.json
          if ! git diff --cached --quiet; then
            git commit -m "Préparer les planches WebP pour le jeu Godot"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF"; then exit 0; fi
            done
            exit 1
          fi
