name: Confirmer la correction des sols sur GitHub Pages
on:
  push:
    branches: [codex/controle-visuel-sols-83]
    paths: ['.github/workflows/controle-sols-83.yml']
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c476bc67511d0299114a3b69431ed2c6e3b8faf
          sparse-checkout: essais/godot-v1
      - name: Vérifier le paquet de jeu et sa page publique
        run: |
          set -euo pipefail
          base=https://corentincarratier.github.io/aldoria/essais/godot-v1/
          for i in $(seq 1 12); do
            if curl -fsSL --retry 1 "${base}index.pck?sols=5c476bc6" -o "$RUNNER_TEMP/public.pck" && cmp -s "$RUNNER_TEMP/public.pck" essais/godot-v1/index.pck; then
              curl -fsSL "${base}?sols=5c476bc6" -o "$RUNNER_TEMP/page.html"
              cmp -s "$RUNNER_TEMP/page.html" essais/godot-v1/index.html
              echo SOLS_CORRIGES_EN_LIGNE
              exit 0
            fi
            sleep 5
          done
          exit 1
