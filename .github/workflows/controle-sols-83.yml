name: Contrôler le rendu de la copie sur Safari et Chromium
on:
  push:
    branches: [codex/controle-visuel-sols-83]
    paths: ['.github/workflows/controle-sols-83.yml']
permissions:
  contents: read
jobs:
  pixels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chrome
          - os: macos-latest
            browser: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ac6df79ce3462c03558c1b64345f1f6887ce3a6
      - name: Comparer les textures et les captures de jeu
        env:
          NAVIGATEUR: ${{ matrix.browser }}
        run: |
          if [ "$NAVIGATEUR" = "safari" ]; then sudo safaridriver --enable; fi
          npm install --prefix "$RUNNER_TEMP/sols" --no-audit --no-fund selenium-webdriver@4.27.0 sharp@0.33.5
          export NODE_PATH="$RUNNER_TEMP/sols/node_modules"
          python3 -m http.server 8090 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          node godot/outils-v1/verifier-sols.cjs "$NAVIGATEUR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesure-${{ matrix.browser }}
          path: ${{ runner.temp }}/aldoria-sol-*.png
