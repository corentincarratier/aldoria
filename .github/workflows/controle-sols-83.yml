name: Contrôler le rendu de la copie sur Safari et Chromium
on:
  push:
    branches: [codex/controle-visuel-sols-83]
    paths: ['.github/workflows/controle-sols-83.yml']
permissions:
  contents: read
jobs:
  pixels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browser: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b47ce5f5db2a66aa03de0f3854d757b2450a16df
      - name: Comparer les textures et les captures de jeu
        env:
          NAVIGATEUR: ${{ matrix.browser }}
        run: |
          for domain in com.apple.Safari com.apple.WebKit.WebContent; do
            for pref in UseGPUProcessForCanvasRenderingEnabled UseGPUProcessForDOMRenderingEnabled CanvasUsesAcceleratedDrawing AcceleratedDrawingEnabled; do
              defaults write "$domain" "WebKitPreferences.$pref" -bool false
            done
          done
          sudo safaridriver --enable
          npm install --prefix "$RUNNER_TEMP/sols" --no-audit --no-fund selenium-webdriver@4.27.0 sharp@0.33.5
          export NODE_PATH="$RUNNER_TEMP/sols/node_modules"
          python3 -m http.server 8090 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          node godot/outils-v1/verifier-sols.cjs "$NAVIGATEUR"
          node -e "require('sharp')(process.env.RUNNER_TEMP+'/aldoria-sol-safari-2_3.png').resize(500).jpeg().toBuffer().then(b=>console.log('VUE_PLAINE '+b.toString('base64')))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesure-${{ matrix.browser }}
          path: ${{ runner.temp }}/aldoria-sol-*.png
